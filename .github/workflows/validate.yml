name: AX Contest Validation

on:
  push:
    branches:
      - automation-staging
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Validate required files
        run: |
          test -f app.py
          test -f requirements.txt
          test -f OPERATIONS.md
          test -f supabase/migrations/20261029140117_setup_ax_contest_staging_and_ops.sql

      - name: Guard against accidental production default changes
        run: |
          grep -q 'AX_ENV' app.py
          grep -q 'stg_agents' app.py
          grep -q 'stg_scores' app.py
          grep -q 'stg_app_settings' app.py
